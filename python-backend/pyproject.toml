[project]
name = "python-backend"
version = "0.1.0"
description = "多 Agent 电商系统后端(重构目标态:纯 LangGraph supervisor + 切片式人工环节,见 docs/adr/0005)"
authors = [
    { name = "moondream69", email = "94357296+moondream69@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "langchain-openai>=1.6.0",
    "langfuse>=3.0.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pymilvus>=2.6.17,<3.0.0",   # 与 Milvus server 2.6.x 配套(Milvus 3.0 新线不追)
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-socketio>=5.16.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "aiohttp>=3.14.3",
    "pypdf>=6.18.1",
    "pyyaml>=6.0.3",
    "anthropic>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
    "ty>=0.0.78",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: 端到端测试,需真实 Postgres/Milvus/Ollama/DeepSeek 在线",
    "integration: 依赖 docker dev Postgres 的集成测试",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "DTZ", "BLE"]
ignore = ["BLE001", "S110"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["alembic/versions/**"]

# __init__.py 的 Windows 事件循环策略块:platform 分支在 Linux 目标下被静态剪枝,
# 其中的 `# ty: ignore[deprecated]` 会被判"未使用"(Windows 目标下则确实在用)——
# 单条 ignore 无法同时满足两个平台,故仅对该文件关掉 unused-ignore-comment。
[[tool.ty.overrides]]
include = ["src/python_backend/__init__.py"]

[tool.ty.overrides.rules]
unused-ignore-comment = "ignore"
