[project]
name = "python-backend"
version = "0.1.0"
description = "Python 版多 Agent 电商系统后端(FastAPI + LangGraph,由 NestJS 迁移而来)"
readme = "README.md"
authors = [
    { name = "moondream69", email = "94357296+moondream69@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-socketio>=5.16.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
    "ty>=0.0.78",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: 端到端测试,需真实 Postgres/Redis/Ollama/DeepSeek 在线",
    "integration: 依赖 docker dev Postgres 的集成测试",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]

[tool.ruff.lint]
# 默认 E4/E7/E9/F 之上,追加常见静态规则。BLE001(盲捕获)与 S110(try-except-pass)
# 是 BaseAgent/EventBus 的错误兜底设计(失败仅告警不中断、缓存静默降级),全局放行。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "DTZ", "BLE"]
ignore = ["BLE001", "S110"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["alembic/versions/**"]
