version: 1
# 规划切片(票 #61,spec #55 A 段 / Solution C):评 Manager 的规划产出——**从同任务跑批的 plan 段取评**,
# 不另设「只规划」捷径(spec #55 暂存假设 5):这些场景照走任务线(``POST /api/tasks``),任务详情的 plan
# 段即判分对象(切片产出照带,见别处的 `#切片` 键)。固定指令入仓(LLM 不生成评测输入),**选品 / 订单 /
# 客服三域各一条**覆盖路由面(票面「选品 / 客服类各若干」);判据三条是所有规划切片场景**共用**的一套
# (依赖声明 / 划分 / 领域路由),与草稿两线同哲学:不为场景分叉 rubric。
scenarios:
- id: plan-category-trend-zh
  surface: 规划切片
  input: |-
    分析一下便携咖啡机在美国市场的选品机会
  rubric:
  - 依赖声明与执行先序一致:声明了依赖的切片确实排在被依赖切片之后;彼此独立的切片没有被硬串成一条链
  - 切片划分合理:总片数在 5 片以内,且每片是一个可独立完成、边界清晰的执行段(不把一件事拆成多片,也不把多件事并成一片)
  - 领域路由正确:各切片分派的业务域与其职责相符(选品调研/市场分析/报告 → 选品;商品与订单操作、库存物流 → 订单;买家消息处理/查证/起草 → 客服)
  note: 选品域首条:同一句固定指令取规划段,评依赖声明与领域路由;这条同时是选品域的规划面基线
- id: plan-order-logistics-zh
  surface: 规划切片
  input: |-
    帮我看看最近的订单和物流情况,有异常的处理一下
  rubric:
  - 依赖声明与执行先序一致:声明了依赖的切片确实排在被依赖切片之后;彼此独立的切片没有被硬串成一条链
  - 切片划分合理:总片数在 5 片以内,且每片是一个可独立完成、边界清晰的执行段(不把一件事拆成多片,也不把多件事并成一片)
  - 领域路由正确:各切片分派的业务域与其职责相符(选品调研/市场分析/报告 → 选品;商品与订单操作、库存物流 → 订单;买家消息处理/查证/起草 → 客服)
  note: 订单域第二条:查询与异常处置同句时规划器该不该拆片、依赖怎么声明——这条守住「不把两件事并成一片」与订单域路由
- id: plan-cs-aftersale-zh
  surface: 规划切片
  input: |-
    买家反馈收到的商品破损了要求退货退款,帮我处理这条消息
  rubric:
  - 依赖声明与执行先序一致:声明了依赖的切片确实排在被依赖切片之后;彼此独立的切片没有被硬串成一条链
  - 切片划分合理:总片数在 5 片以内,且每片是一个可独立完成、边界清晰的执行段(不把一件事拆成多片,也不把多件事并成一片)
  - 领域路由正确:各切片分派的业务域与其职责相符(选品调研/市场分析/报告 → 选品;商品与订单操作、库存物流 → 订单;买家消息处理/查证/起草 → 客服)
  note: 客服域第三条(票面「选品 / 客服类各若干」):买家消息处置该路由到客服域的查证→起草,而不是被当成订单操作——这条守住客服域路由
