version: 1
# 客服草稿两线(票 #60,spec #55 A 段):起草工作台(同步端点、无任务轨迹,跑批器自建评测根 trace)
# 与任务内客服(经 POST /api/tasks 取客服切片产出)——**两线共用同一套草稿质量维度**,不为线分叉 rubric;
# 区分靠 surface 字段。判据是「禁止式 + 条件式」写法:场景不涉及的维度自然空过(不判不适用),
# 故同一套判据能横铺两线。买家消息文案固定入仓(LLM 不生成评测输入),与 simulator SERVICE_QUESTIONS 同风格。
scenarios:
- id: cs-workbench-stock-zh
  surface: 客服草稿·工作台
  input: |-
    桌面收纳架 深空黑款现在还有货吗?大概什么时候能发货?
  rubric:
  - 不编造发货时效与物流承诺:涉及时效/物流的表述有查证证据支撑,无证据时如实说明未查到
  - 涉及具体商品(库存/价格/在售状态)时逐款给出查证结论,不编造;未查到如实说明
  - 结论性陈述有查证证据(FAQ/订单/商品)支撑:引用标记与查证证据对应,无凭空论断
  note: 工作台线首条:一条消息同时踩商品(点名款式的库存)与 FAQ(发货时效)两类证据,三条判据全非空转
- id: cs-workbench-damage-zh
  surface: 客服草稿·工作台
  input: |-
    收到的商品运输途中破损了,要怎么处理?
  rubric:
  - 不编造发货时效与物流承诺:涉及时效/物流的表述有查证证据支撑,无证据时如实说明未查到
  - 涉及具体商品(库存/价格/在售状态)时逐款给出查证结论,不编造;未查到如实说明
  - 结论性陈述有查证证据(FAQ/订单/商品)支撑:引用标记与查证证据对应,无凭空论断
  note: 工作台线第二条:纯 FAQ 面(破损处理条目)——查证条目须被如实转述并标注引用,不凭常识作答
- id: cs-workbench-shipping-en
  surface: 客服草稿·工作台
  input: |-
    How long does delivery usually take, and how much does shipping cost?
  rubric:
  - 不编造发货时效与物流承诺:涉及时效/物流的表述有查证证据支撑,无证据时如实说明未查到
  - 涉及具体商品(库存/价格/在售状态)时逐款给出查证结论,不编造;未查到如实说明
  - 结论性陈述有查证证据(FAQ/订单/商品)支撑:引用标记与查证证据对应,无凭空论断
  locale: en
  note: 工作台线第三条:多语(B19)——草稿语言须随买家消息(英文消息出英文草稿),语料为中文 FAQ 的跨语检索
- id: cs-task-returns-zh
  surface: 客服草稿·任务内
  input: |-
    你们的退货政策是什么?我买的商品有点问题想退。
  rubric:
  - 不编造发货时效与物流承诺:涉及时效/物流的表述有查证证据支撑,无证据时如实说明未查到
  - 涉及具体商品(库存/价格/在售状态)时逐款给出查证结论,不编造;未查到如实说明
  - 结论性陈述有查证证据(FAQ/订单/商品)支撑:引用标记与查证证据对应,无凭空论断
  note: 任务内线首条:客服切片 verify(faq_search)→ draft 全链,退货运引用面(切块标识式 → 上报号)
- id: cs-task-customs-zh
  surface: 客服草稿·任务内
  input: |-
    怎么查询关税和清关费用?
  rubric:
  - 不编造发货时效与物流承诺:涉及时效/物流的表述有查证证据支撑,无证据时如实说明未查到
  - 涉及具体商品(库存/价格/在售状态)时逐款给出查证结论,不编造;未查到如实说明
  - 结论性陈述有查证证据(FAQ/订单/商品)支撑:引用标记与查证证据对应,无凭空论断
  note: 任务内线第二条:关税清关条目(与 sim 的 SERVICE_QUESTIONS 同风格)——无订单号、无商品指代,纯 FAQ 查证
