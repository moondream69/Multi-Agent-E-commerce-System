version: 1
scenarios:
- id: smart-home-us
  surface: 选品报告
  input: |-
    分析一下智能家居在美国市场的选品机会
  rubric:
  - 给出明确的评分等级(或等价的分级结论——指对机会强弱给出明确倾向的表述,「数据无法分析 / 未评分」不算),并说明该等级的判断依据
  - 结论性论断有检索依据:引用标记与检索命中对应,无凭空论断
  note: >-
    首条金标场景(选品 tracer 先行):固定指令取模拟器运营指令同风格文案,不随任何生成漂移。
    品类覆盖锚:usitc-global-digital-trade-1 的「Smart Homes」段(2016 年美国市场 $10.4B、
    2017 年预计 $14.6B 约占全球 70%),与 smart-band-us 同属消费电子/智能硬件的检索面。
    **原 id = coffee-maker-us、原品类 = 便携咖啡机**——该品类在情报语料零覆盖(全库无咖啡机市场
    数据),切片只能如实拒答而判据要的分级本就不可能产出;这是**场景与语料错配**,不是 Agent 缺陷
    (#64 分诊表)。改名后 Langfuse dataset 里会留下一条无 run 的旧 item(coffee-maker-us),
    投影按 id 幂等、不做删除。
- id: smart-band-us
  surface: 选品报告
  input: |-
    分析一下智能手环在美国市场的选品机会
  rubric:
  - 给出明确的评分等级(或等价的分级结论——指对机会强弱给出明确倾向的表述,「数据无法分析 / 未评分」不算),并说明该等级的判断依据
  - 结论性论断有检索依据:引用标记与检索命中对应,无凭空论断
  note: >-
    第二条(票 #58 铺开到 2–3 条):同域同风格固定文案。
    品类覆盖锚:usitc-global-digital-trade-1 的「Wearables」段(IDC 出货量与销售额序列)。
- id: remote-health-us
  surface: 选品报告
  input: |-
    看看远程医疗监控设备在美国市场有没有值得跟踪的选品趋势
  rubric:
  - 给出明确的评分等级(或等价的分级结论——指对机会强弱给出明确倾向的表述,「数据无法分析 / 未评分」不算),并说明该等级的判断依据
  - 结论性论断有检索依据:引用标记与检索命中对应,无凭空论断
  note: >-
    第三条:同一选品域的趋势型指令(与两条「分析某品类」不同措辞)——守住路由与趋势作答面。
    品类覆盖锚:usitc-global-digital-trade-1 的「Remote Healthcare Monitoring」段(2016 年全球
    市场 $8.4B、7.1M 远程监护患者、睡眠治疗段 +70% 成最大细分),趋势型数据齐、且与既有两条
    检索面隔开一层章内距离。**原 id = outdoor-trend、原品类 = 户外运动**——该品类在情报语料零覆盖
    (全库无户外市场数据,命中全落可穿戴/数字贸易/南亚电商),切片依硬契约如实拒答而判据①要的
    趋势判断本就不可能产出;与 coffee-maker-us 同属**场景与语料错配**(#66 分诊表)。改名后
    Langfuse dataset 里会留下一条无 run 的旧 item(outdoor-trend),投影按 id 幂等、不做删除。
