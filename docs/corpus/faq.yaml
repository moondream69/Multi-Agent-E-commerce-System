- doc_id: faq-logistics
  kind: faq
  title: 物流配送 FAQ
  source: 自造 FAQ 语料库
  published_at: '2026-09-14'
  category: 物流配送
  attribution: LLM 生成候选 + 人工筛选修订(2026-09-14 冻结);买家问/卖家客服答方向为自造
  license_note: 自造语料,不涉第三方权利:LLM 生成候选(一次)+ 人工筛选修订后冻结,冻结稿即评测基线
  entries:
  - question: 包裹一般多久能送到?
    answer: 东南亚地区一般 5-10 个工作日送达,欧美地区 7-15 个工作日;偏远地区(岛屿、内陆省份)需在此基础上再加 3-5 个工作日。发货后系统会给您推送物流单号,可在订单详情页实时查看。
    locale: zh-CN
    tags:
    - 时效
  - question: 下单后多久发货?
    answer: 现货商品在付款后 48 小时内发出(节假日顺延);预售商品以商品页标注的发货日期为准。超过 72 小时未发货,您可以联系客服申请催发或取消订单。
    locale: zh-CN
    tags:
    - 发货时效
  - question: 怎么查物流轨迹?为什么一直不更新?
    answer: 在订单详情页点击「查看物流」即可看到全程轨迹。跨境包裹在干线运输和清关期间可能 2-3 天不更新,属正常现象;若超过 5 个工作日无新轨迹,请联系客服,我们会向承运商发起查询。
    locale: zh-CN
    tags:
    - 追踪
  - question: 运费怎么算?满多少包邮?
    answer: 东南亚市场订单满 $199 包邮,未满收取 $18 运费;欧美市场满 $299 包邮,未满收取 $35。大件商品(家具、家电)按体积重单独计价,下单页会显示实际运费。
    locale: zh-CN
    tags:
    - 运费
  - question: 可以寄到偏远岛屿吗?
    answer: 大部分岛屿可以送达,但需要在标准时效上增加 3-5 个工作日,且部分小岛仅支持到最近的港口或自提点自取。下单前请把完整地址发给客服确认可达性,避免退件。
    locale: zh-CN
    tags:
    - 偏远地区
  - question: 下单后可以修改收货地址或电话吗?
    answer: 包裹未发出时可以免费修改;已发出但未清关的,我们可以向承运商发起改址申请(部分承运商收取 $20 改址费);已进入派送环节的无法修改。请尽快联系客服并提供订单号。
    locale: zh-CN
    tags:
    - 地址修改
  - question: 收件人电话写错了怎么办?
    answer: 请立即联系客服,在包裹派送前我们可向承运商提交更正。若因电话错误导致派送失败退件,重新发货的运费需由您承担。
    locale: zh-CN
    tags:
    - 地址修改
  - question: 一个订单里的商品会分开寄吗?
    answer: 同一订单默认合并发货。若商品分属不同仓库或其中一件缺货,我们会拆单发出,拆单不会加收运费,物流单号会分别推送。
    locale: zh-CN
    tags:
    - 合并发货
  - question: 物流显示已签收,但我没有收到包裹,怎么办?
    answer: 请先确认是否由家人、前台或门卫代收,并核对物流轨迹的签收地点。确认未收到的,请在 48 小时内联系客服,我们会在 3 个工作日内向承运商发起调查;经查实丢件的,全额退款或免费补发。
    locale: zh-CN
    tags:
    - 丢件
  - question: 可以指定快递公司吗?
    answer: 暂不支持指定承运商。我们会根据目的地、时效和清关能力自动选择最优渠道,通常为当地主流快递(如 J&T、Ninja Van、Flash Express)。
    locale: zh-CN
    tags:
    - 承运商
  - question: 包裹在运输途中破损了怎么处理?
    answer: 请拒收或在签收后 48 小时内拍照取证(外箱 + 内件 + 面单)并联系客服。核实为运输破损的,我们承担全部责任,可免费补发或全额退款。
    locale: zh-CN
    tags:
    - 破损
  - question: 包裹到了当地由谁派送?可以联系派送员吗?
    answer: 跨境干线到达目的国后,由当地合作快递(如 J&T、Ninja Van、Flash Express、Kerry)完成末端派送,轨迹会切换为当地单号。派送前快递员通常会电话联系,您也可凭当地单号在承运商官网预约派送时间。
    locale: zh-CN
    tags:
    - 末端派送
  - question: 节假日或大促期间发货会延迟吗?
    answer: 会。大促(如 9.9、11.11、12.12)与当地长假期间订单量激增,发货时间可能延长至 3-5 个工作日,物流时效整体顺延 2-4 天。建议提前下单,急件请避开大促高峰。
    locale: zh-CN
    tags:
    - 旺季延迟
  - question: 可以加急配送吗?
    answer: 支持加急:下单时选择「加急专线」,东南亚 3-5 个工作日、欧美 5-7 个工作日送达,运费按目的地加收 $45-$90。加急件清关仍按当地海关流程,极端情况可能顺延。
    locale: zh-CN
    tags:
    - 加急
  - question: 支持买家自提吗?
    answer: 目前仅支持「到自提点自取」:马来西亚、泰国部分城市可选择附近自提点,包裹到达后保留 5 天,逾期未取将自动退回。自提需本人凭取件码与手机号领取。
    locale: zh-CN
    tags:
    - 自提
  - question: 可以发到转运仓或集运仓吗?
    answer: 可以。下单时把转运仓地址作为收货地址填写,并留意是否加注您的会员号/入仓码。请注意:包裹入仓后的转运、复核属转运商责任,我们不承担二次运输途中的破损与丢失。
    locale: zh-CN
    tags:
    - 转运
  - question: 大件商品(家具、家电)怎么配送?
    answer: 大件商品走专线物流,发货后 7-20 个工作日送达,偏远地区可能更久。多数国家仅配送到楼下或小区门口,不包含上门安装;需要搬运上楼的请在订单备注中说明,可能产生附加费用。
    locale: zh-CN
    tags:
    - 大件物流
  - question: 包裹被退回卖家了,怎么办?
    answer: 退件通常因电话不通、多次派送失败、清关资料缺失或超期未取自提点。包裹退回后我们会联系您确认原因,可选择重新发货(运费自理)或退款(已产生的往返运费从退款中扣除)。
    locale: zh-CN
    tags:
    - 退件
  - question: 外包装可以不带品牌标识吗?
    answer: 可以。在订单备注中填写「保密发货」,我们会使用无品牌标识的中性外箱,面单上的商品名称也会写为「日用品」等通用描述。
    locale: zh-CN
    tags:
    - 包装
  - question: 还没发货,可以取消订单吗?
    answer: 可以。未发货订单可在订单详情页自助取消,款项原路退回(1-7 个工作日);已发货的订单需走拒收或退货流程。预售与大促期间商品进入打包环节后不可取消,请尽快操作。
    locale: zh-CN
    tags:
    - 发货时效
- doc_id: faq-returns
  kind: faq
  title: 退货退款 FAQ
  source: 自造 FAQ 语料库
  published_at: '2026-09-14'
  category: 退货退款
  attribution: LLM 生成候选 + 人工筛选修订(2026-09-14 冻结);买家问/卖家客服答方向为自造
  license_note: 自造语料,不涉第三方权利:LLM 生成候选(一次)+ 人工筛选修订后冻结,冻结稿即评测基线
  entries:
  - question: 收到货不满意可以退吗?几天内可以退?
    answer: 签收后 7 天内可无理由退货,商品需保持完好(不影响二次销售,吊牌、包装、配件齐全);存在质量问题或与描述不符的,15 天内可退换,由我们承担来回运费。
    locale: zh-CN
    tags:
    - 退货条件
  - question: 超过 7 天了还能退吗?
    answer: 超过 7 天的无理由退货申请无法受理;但若属于质量问题、错发漏发或运输破损,凭照片证明可在 15 天内申请退换。超过 15 天的订单请走售后保修流程。
    locale: zh-CN
    tags:
    - 退货条件
  - question: 拆封/试穿后还能退吗?
    answer: 可以。试穿、试戴不影响二次销售即可(请不要剪吊牌、不要洗涤、不要在鞋底留下明显磨损);数码类商品拆封后需保持全套配件与包装完整。
    locale: zh-CN
    tags:
    - 退货条件
  - question: 退货流程怎么走?
    answer: 三步:①在订单详情页点「申请退货」并填写原因;②客服在 1 个工作日内审核通过后,按指引发回并上传退货运单号;③仓库签收验收后原路退款。全程可在订单页查看进度。
    locale: zh-CN
    tags:
    - 退货流程
  - question: 退货要自己寄回吗?可以上门取件吗?
    answer: 马来西亚、泰国、新加坡支持上门取件,审核通过后我们安排承运商上门,您无需自行寄出;其他国家/地区需您自行寄回,请保留寄件凭证与运单号。
    locale: zh-CN
    tags:
    - 退货流程
  - question: 退货运费由谁承担?
    answer: 质量问题、错发漏发、运输破损:来回运费均由我们承担;7 天无理由退货:退回运费由您承担,且原单包邮条件不再满足时可能扣除原发运费。上门取件的市场不额外收费。
    locale: zh-CN
    tags:
    - 运费承担
  - question: 退款多久到账?退到哪里?
    answer: 仓库验收通过后 1-3 个工作日发起退款,退回到原支付渠道:信用卡 3-7 个工作日、本地钱包 1-3 个工作日、银行转账 5-10 个工作日。具体到账时间以渠道为准。
    locale: zh-CN
    tags:
    - 退款时效
  - question: 退款金额包含运费吗?
    answer: 包含:退款金额 = 商品实付金额 + 已支付的运费(质量问题全额退)。若订单达到包邮门槛后退货导致剩余商品不满门槛,会按规则扣除原发运费($18 或 $35)。
    locale: zh-CN
    tags:
    - 退款金额
  - question: 可以换货而不是退款吗?
    answer: 可以。同款换码/换色在 15 天内支持一次免运费换货(库存允许时);换其他款式按「退货 + 重新下单」处理,差价多退少补。换货寄出后 2-3 个工作日内发出新品。
    locale: zh-CN
    tags:
    - 换货
  - question: 一单多件,可以只退其中一件吗?
    answer: 可以部分退货。申请时勾选需要退回的商品即可,退款按该商品的实付金额计算;若剩余商品不满包邮门槛,原发运费按比例分摊扣除。
    locale: zh-CN
    tags:
    - 部分退货
  - question: 收到商品少了件,怎么补?
    answer: 请在签收后 48 小时内提供开箱照片与外箱重量照片,核实缺件后我们直接补发缺失商品,无需退回已收商品;补发件 3 个工作日内发出,运费由我们承担。
    locale: zh-CN
    tags:
    - 缺件
  - question: 定制/定做商品可以退吗?
    answer: 定制类商品(刻字、改尺寸、定制图案)非质量问题不支持无理由退货;若制作与您确认的图纸不符,可申请重做或全额退款。
    locale: zh-CN
    tags:
    - 特殊商品
  - question: 退货运单号怎么提交?多久内要寄出?
    answer: 审核通过后请在 7 天内寄出,并在订单页「退货详情」中填写承运商与运单号。逾期未寄出的申请将自动关闭,如需继续退货请重新申请。
    locale: zh-CN
    tags:
    - 退货流程
  - question: 拒收包裹会退款吗?
    answer: 会按「拒收退件」处理:包裹退回仓库验收后 1-3 个工作日退款,退款金额扣除往返运费(质量问题除外)。建议先与客服沟通再拒收,以免产生不必要的运费损失。
    locale: zh-CN
    tags:
    - 拒收
  - question: 退款的商品需要原包装寄回吗?
    answer: 需要尽量使用原包装或等效的坚固包装,并附上订单号。请勿使用到付件或平邮(无法追踪),因此产生的丢件损失需由您承担。
    locale: zh-CN
    tags:
    - 退货流程
- doc_id: faq-payment
  kind: faq
  title: 支付方式 FAQ
  source: 自造 FAQ 语料库
  published_at: '2026-09-14'
  category: 支付方式
  attribution: LLM 生成候选 + 人工筛选修订(2026-09-14 冻结);买家问/卖家客服答方向为自造
  license_note: 自造语料,不涉第三方权利:LLM 生成候选(一次)+ 人工筛选修订后冻结,冻结稿即评测基线
  entries:
  - question: 支持哪些支付方式?
    answer: 支持信用卡(Visa / Mastercard / JCB)、本地钱包(GrabPay / GoPay / TrueMoney / GCash)、银行转账与部分市场的货到付款(COD)。结算页会按收货国家自动列出可用渠道。
    locale: zh-CN
    tags:
    - 支付渠道
  - question: 可以用人民币付款吗?
    answer: 结算页默认以商品标价币种(USD)显示,信用卡渠道会自动换算为您卡片的记账币种(含货币转换费,由发卡行收取);部分本地钱包支持直接以当地货币(THB / MYR / IDR / PHP)支付。
    locale: zh-CN
    tags:
    - 币种
  - question: 汇率按什么时点计算?可以锁定汇率吗?
    answer: 汇率按支付渠道在扣款时点的实时汇率计算,下单页展示的金额为预估值;暂不支持锁汇。若对到账金额有疑问,请提供银行流水与订单号,我们协助核对。
    locale: zh-CN
    tags:
    - 币种
  - question: 支付失败怎么办?
    answer: 请先核对卡号、有效期、CVV 与账单地址是否与发卡行记录一致,并确认已开通境外/线上支付。若仍失败,可更换支付渠道或联系发卡行;连续失败 3 次后订单会自动关闭,重新下单即可。
    locale: zh-CN
    tags:
    - 支付失败
  - question: 已经扣款了但订单显示未支付,怎么办?
    answer: 多为渠道回调延迟(通常 10-30 分钟自动同步),也可能是预授权冻结。请勿重复支付,等待 30 分钟后刷新订单页;若仍显示未支付,请联系客服并提供扣款凭证,我们会在 1 个工作日内核销或退款。
    locale: zh-CN
    tags:
    - 支付失败
  - question: 重复扣款了两笔怎么办?
    answer: 请提供两笔扣款的流水截图与订单号,我们会在 1 个工作日内核对;确认为重复扣款的,多余一笔将原路退回(1-7 个工作日到账,视渠道而定)。
    locale: zh-CN
    tags:
    - 支付失败
  - question: 支持分期付款吗?
    answer: 泰国、菲律宾、印尼部分渠道支持 3/6/12 期分期,以结算页显示为准,分期手续费由合作机构收取;当期免息活动以商品页标注为准。
    locale: zh-CN
    tags:
    - 分期
  - question: 下单后多久内需要完成支付?
    answer: 普通订单请在 30 分钟内完成支付,大促期间以结算页倒计时为准。超时订单自动取消并释放库存,优惠券同时退回您的账户。
    locale: zh-CN
    tags:
    - 支付时效
  - question: 可以开电子发票吗?
    answer: 可以。下单时可在备注中填写抬头与税号,我们会在发货后 3 个工作日内把电子发票发送到您的注册邮箱;已完成的订单也可以联系客服补开。
    locale: zh-CN
    tags:
    - 发票
  - question: 支持银行转账付款吗?
    answer: 新加坡、马来西亚支持银行转账:选择该渠道后会显示收款账户与以订单号尾缀的备注要求。请务必在转账备注中填写订单号,并在转账后把凭证发给客服,核对到账后 1-2 小时内发货。
    locale: zh-CN
    tags:
    - 支付渠道
  - question: 支付安全吗?我的卡号会被保存吗?
    answer: 支付全程由持牌支付机构处理并加密传输,我们不接触也不存储完整卡号,仅保留渠道返回的脱敏尾号用于对账;网站不保存 CVV。
    locale: zh-CN
    tags:
    - 安全
  - question: 可以用别人的卡或请朋友代付吗?
    answer: 可以代付,但收货人需与订单一致。为防范风险,若支付账户与收货信息差异较大,风控可能要求补充验证(如付款人授权说明);未能通过验证的订单会取消并全额退款。
    locale: zh-CN
    tags:
    - 安全
  - question: 优惠券和积分可以叠加使用吗?
    answer: 同一订单限用一张优惠券,可与积分抵扣叠加:100 积分抵 $1,单笔最多抵扣订单金额的 20%。退货时优惠券不退(已过期不补),积分按抵扣比例退回。
    locale: zh-CN
    tags:
    - 优惠
  - question: 货到付款(COD)支持哪些国家?有金额上限吗?
    answer: 目前支持泰国、越南、菲律宾与印尼,单笔上限为当地货币等值 $2,000;COD 订单签收时直接付给快递员,拒收超过 2 次的账号将暂停 COD 权限。
    locale: zh-CN
    tags:
    - 支付渠道
  - question: 退款会退到哪个渠道?可以退到别的账户吗?
    answer: 退款一律原路退回,无法更换到其他账户或银行卡。原渠道关闭(如卡已注销)时,请提供新的收款账户证明,我们改由公司账户转账,处理时间约 5-10 个工作日。
    locale: zh-CN
    tags:
    - 退款路径
- doc_id: faq-customs
  kind: faq
  title: 关税清关 FAQ
  source: 自造 FAQ 语料库
  published_at: '2026-09-14'
  category: 关税清关
  attribution: LLM 生成候选 + 人工筛选修订(2026-09-14 冻结);买家问/卖家客服答方向为自造
  license_note: 自造语料,不涉第三方权利:LLM 生成候选(一次)+ 人工筛选修订后冻结,冻结稿即评测基线
  entries:
  - question: 关税由谁承担?
    answer: 目的国进口关税与增值税由买家承担(海关向收件人征收),我们不代收也不代缴;若买家拒付导致包裹退运,往返运费与已产生的税费从退款中扣除。走包税渠道的订单以商品页「包税」标识为准。
    locale: zh-CN
    tags:
    - 关税
  - question: 关税大概要交多少?怎么算?
    answer: 应缴税额 = 完税价格 × (关税税率 + 增值税率),各国税率与起征点不同:东南亚多数国家对低值包裹免税,超过起征点后综合税率约 10%-30%。最终金额以海关核定为准。
    locale: zh-CN
    tags:
    - 关税
  - question: 下单时显示的税费预估准吗?为什么和实际不一样?
    answer: 下单页展示的是按品类平均税率估算的参考值,海关会按实际申报品类、当日汇率与当地政策核定,因此可能存在差异。预估仅为提示,不作为实际缴费依据。
    locale: zh-CN
    tags:
    - 税费预估
  - question: 各个国家的免税额度是多少?
    answer: 常见参考:新加坡 400 新元、马来西亚 500 令吉、泰国 1,500 泰铢、印尼 3 美元、菲律宾 10,000 比索。政策会调整,且按「同一收件人同日多包裹合并计算」执行,请以当地海关最新公告为准。
    locale: zh-CN
    tags:
    - 免税额度
  - question: 需要提供税号吗?哪些国家需要?
    answer: 部分国家要求收件人提供税号才能清关:印尼需要 NPWP,菲律宾需要 TIN,巴西需要 CPF。下单时请在备注中填写;未提供的包裹可能清关延误甚至退运。
    locale: zh-CN
    tags:
    - 税号
  - question: 申报价值可以写低一点吗?
    answer: 不可以。我们按订单实付金额如实申报,低报属于违法行为:一旦被海关查验,包裹可能被扣留、罚款或销毁,由此产生的损失与责任由申报人承担,我们不能配合低报请求。
    locale: zh-CN
    tags:
    - 申报价值
  - question: 可以申报成礼品或样品吗?
    answer: 不可以。商品类包裹按实际品类与价值申报,不因「礼品」「样品」描述而免税,且不实申报同样面临查验风险。若您确有真实样品寄送需求,请联系客服走单独的商业样品流程。
    locale: zh-CN
    tags:
    - 申报价值
  - question: 哪些商品属于禁限运?
    answer: 各国禁限运清单不同,常见的有:纯电池与充电宝(未做认证的)、液体与粉末、药品与保健品、食品、仿牌与侵权商品、刀具与管制器具。下单前请咨询客服确认,违规商品会被海关扣留且运费不退。
    locale: zh-CN
    tags:
    - 禁限运
  - question: 包裹被海关扣了怎么办?
    answer: 先查看物流轨迹与海关通知:多数情况是要求补交税费或资料。请在 5 个工作日内按指引提交材料(税号、身份证明、付款凭证),逾期未处理可能被退运或销毁。需要协助请联系客服,我们提供材料模板。
    locale: zh-CN
    tags:
    - 清关异常
  - question: 海关要求补充资料,我该怎么做?
    answer: 请把海关通知截图发给客服,我们会出具商业发票与申报明细供您提交;您需要补充的通常是身份证明、税号与订单付款凭证。资料齐全后清关一般在 1-3 个工作日完成。
    locale: zh-CN
    tags:
    - 清关资料
  - question: 清关一般要多久?
    answer: 正常 1-3 个工作日;旺季、抽查或补交资料时可能延长到 5-7 个工作日。清关期间物流轨迹不更新属正常现象,请耐心等待,无需重复查询。
    locale: zh-CN
    tags:
    - 清关时效
  - question: 包裹被退运或销毁了怎么办?
    answer: 退运/销毁通常因拒付税费、申报不实、禁限运或超期未处理。包裹退回后我们核实运费损失:非我方责任的,退款金额扣除已产生的往返运费与税费;销毁的包裹无法退回,亦无法退款。
    locale: zh-CN
    tags:
    - 退运
  - question: 可以走包税渠道吗?
    answer: 部分商品支持包税专线(商品页标注「包税」):运费内含预估税费,清关时无需您额外付费,但清关时效略长(加 2-4 个工作日)。包税仅覆盖常规税率,遇海关加征特殊税费仍需另行处理。
    locale: zh-CN
    tags:
    - 包税
  - question: 已经交的关税可以退吗?
    answer: 关税由目的国海关征收,退货时原则上不退还;仅当海关确认多征、错征时,可凭缴税凭证与海关回执申请退库,流程约 15-30 个工作日。我们可以协助出具退货证明。
    locale: zh-CN
    tags:
    - 退税
  - question: 同一订单拆成多个包裹,税费怎么算?
    answer: 税费按包裹逐个计征,不因同属一个订单而合并免税。拆分发货可能各自达到起征点从而产生多笔税费;若您对税费敏感,建议合单发货或提前咨询客服拆分方案。
    locale: zh-CN
    tags:
    - 关税
- doc_id: faq-quality
  kind: faq
  title: 质量真伪 FAQ
  source: 自造 FAQ 语料库
  published_at: '2026-09-14'
  category: 质量真伪
  attribution: LLM 生成候选 + 人工筛选修订(2026-09-14 冻结);买家问/卖家客服答方向为自造
  license_note: 自造语料,不涉第三方权利:LLM 生成候选(一次)+ 人工筛选修订后冻结,冻结稿即评测基线
  entries:
  - question: 怎么保证商品是正品?
    answer: 所有商品由品牌方或授权渠道直采,入仓前抽检并留存批次凭证;支持防伪码或序列号验证的商品,可在商品页「正品验证」入口自助核验。假一赔十承诺覆盖全部自营商品。
    locale: zh-CN
    tags:
    - 正品保证
  - question: 防伪码在哪里?怎么验证?
    answer: 防伪码通常印在包装盒侧面或内衬标签上(刮开涂层可见)。请到品牌官网或商品页的验证入口输入完整码值,系统会返回首次查询时间;若提示「已被查询」或码值不存在,请立即联系客服。
    locale: zh-CN
    tags:
    - 鉴别
  - question: 怀疑买到了仿品,怎么处理?
    answer: 请保留商品、包装与全部配件,拍摄细节照片(logo、走线、标签、防伪码)并联系客服。我们会比对批次凭证,确认为非正品的,按「假一赔十」处理并承担全部运费。
    locale: zh-CN
    tags:
    - 鉴别
  - question: 假一赔十是真的吗?怎么赔?
    answer: 是真的:经核实为仿冒商品的订单,除全额退款外,另行赔付订单实付金额的 10 倍(单笔上限 $10,000),以优惠券或原路转账形式发放,自核实之日起 5 个工作日内到账。
    locale: zh-CN
    tags:
    - 赔付
  - question: 如何举报疑似假货?
    answer: 在订单详情页点击「举报商品」或直接联系客服,提交商品照片、购买凭证与具体疑点。我们会在 3 个工作日内反馈核查结论;举报经核实的,举报人可获得 $50 无门槛券奖励。
    locale: zh-CN
    tags:
    - 赔付
  - question: 收到商品有瑕疵或做工问题怎么办?
    answer: 请在签收后 48 小时内拍照(整体 + 瑕疵特写)并联系客服。轻微瑕疵可选择部分退款(10%-30%)或换新;影响使用的免费换新并承担来回运费,无需您先寄回。
    locale: zh-CN
    tags:
    - 瑕疵
  - question: 商品材质和描述不符怎么办?
    answer: 请提供材质标牌照片与页面描述截图,我们会核对并送检(必要时)。确认为描述不符的,支持全额退款并承担往返运费;我们同时会下架或修正相关页面描述。
    locale: zh-CN
    tags:
    - 描述不符
  - question: 有异味或材质手感不对怎么办?
    answer: 新品(尤其纺织品、皮革)拆封后有轻微气味属正常,通风 24-48 小时即可消散;若气味刺鼻且不散,或有明显材质差异,请在 7 天内联系客服,支持退换。
    locale: zh-CN
    tags:
    - 瑕疵
  - question: 商品有 CE / FDA 等认证吗?
    answer: 涉及认证的品类(电子、玩具、个护)会在商品页标注对应认证(CE / FCC / FDA / SNI)及证书编号;如需完整证书副本,可联系客服索取,我们在 1 个工作日内提供。
    locale: zh-CN
    tags:
    - 认证
  - question: 怎么查商品的生产日期和保质期?
    answer: 个护、美妆、食品类商品的生产日期与保质期印在外包装或瓶身,商品页也会标注「保质期至」;我们发货时保证剩余保质期不少于总时长的 2/3。
    locale: zh-CN
    tags:
    - 保质期
  - question: 收到已过期的商品怎么办?
    answer: 请拍照留证并联系客服,过期为严重违规,我们按「全额退款 + 补偿 $50 券」处理,无需退回商品;同时会对同批次库存进行排查下架。
    locale: zh-CN
    tags:
    - 保质期
  - question: 电子产品的序列号可以查真伪和保修吗?
    answer: 可以。机身或包装上的序列号(SN/IMEI)可在品牌官网查询激活状态与保修期;我们发出的商品支持在商品页提交序列号核对发货批次,与批次不符的可申请退换。
    locale: zh-CN
    tags:
    - 正品保证
  - question: 会买到二手或翻新商品吗?
    answer: 不会在未标注的情况下发出。全新商品均为原封;官方翻新、展示机等特殊状态商品会在标题与商品页显著标注「翻新」「展示机」并说明成色,且不支持无理由退货(功能性故障除外)。
    locale: zh-CN
    tags:
    - 商品状态
  - question: 能先验货再签收吗?
    answer: 多数承运商支持「开箱验货」:签收前可检查外箱与商品外观,发现破损可当场拒收;但拆封使用、通电测试等深度验货需签收后进行,48 小时内的质量反馈同样有效。
    locale: zh-CN
    tags:
    - 验货
  - question: 拆封后影响二次销售的商品还能退吗?
    answer: 质量问题不受拆封影响,可正常退换;无理由退货则要求商品保持完好(吊牌、包装、配件齐全,不影响二次销售)。密封类个护商品一经拆封不支持无理由退货。
    locale: zh-CN
    tags:
    - 瑕疵
- doc_id: faq-sizing
  kind: faq
  title: 尺码适配 FAQ
  source: 自造 FAQ 语料库
  published_at: '2026-09-14'
  category: 尺码适配
  attribution: LLM 生成候选 + 人工筛选修订(2026-09-14 冻结);买家问/卖家客服答方向为自造
  license_note: 自造语料,不涉第三方权利:LLM 生成候选(一次)+ 人工筛选修订后冻结,冻结稿即评测基线
  entries:
  - question: 尺码表在哪里?应该怎么量?
    answer: 每件商品详情页都有「尺码表」入口,标注对应款式的胸围/腰围/衣长等平铺尺寸(单位 cm)。测量建议:贴身衣物量身体净尺寸,外套量常穿同类衣物的平铺尺寸再对照。
    locale: zh-CN
    tags:
    - 尺码表
  - question: 我该选哪个码?能按身高体重推荐吗?
    answer: 可以把身高、体重、常穿尺码发给客服,我们按款式版型给出建议。请注意不同品牌版型差异较大,身高体重只能作参考,以尺码表实测数据为准更稳妥。
    locale: zh-CN
    tags:
    - 选码
  - question: 这款版型偏大还是偏小?
    answer: 商品页会标注「版型偏大/正常/偏小」:偏小款建议选大一码,偏大款建议选小一码。若无标注即按尺码表选择;拿不准时优先选大一码,后续换码也支持。
    locale: zh-CN
    tags:
    - 版型
  - question: 鞋码怎么换算?EUR / US / UK 对照表在哪?
    answer: 商品页鞋类均附 EUR / US / UK / CM 四列对照表,建议以脚长(cm)为准选择:量脚时站立踩纸,取脚跟到最长脚趾的距离,脚宽或脚背高建议选大半码。
    locale: zh-CN
    tags:
    - 鞋码
  - question: 买大了或买小了可以换码吗?
    answer: 可以。15 天内同款换码支持一次免运费换货(库存允许时),换码产生的往返运费由我们承担;换码商品需保持吊牌完好、未洗涤。
    locale: zh-CN
    tags:
    - 换码
  - question: 童装尺码怎么选?按年龄还是身高?
    answer: 建议按身高(cm)选择,年龄仅作参考:同年龄段儿童身高差异较大,尺码表标注的是适用身高区间(如 110-120cm)。偏胖体型建议选大一码。
    locale: zh-CN
    tags:
    - 童装
  - question: 内衣、泳装的尺码怎么选?
    answer: 内衣按「下胸围 + 罩杯」选择(如 75B),泳装按胸围/腰围/臀围三围对照表选择;这两类贴身商品拆封后不支持无理由退货,下单前建议先咨询客服核对尺码。
    locale: zh-CN
    tags:
    - 尺码表
  - question: 衣物尺寸有误差是正常的吗?
    answer: 纺织品为人工裁剪缝制,平铺尺寸允许 ±2cm 误差(针织类 ±3cm),属行业常规范围,不作为质量问题;超出该范围可申请退换并由我们承担运费。
    locale: zh-CN
    tags:
    - 误差
  - question: 有大码或加大码吗?
    answer: 部分款式提供至 4XL / 5XL,可在商品页尺码选择中查看;未覆盖的款式可联系客服,我们会记录需求并反馈给选品,后续上新优先补充。
    locale: zh-CN
    tags:
    - 大码
  - question: 可以按我的尺寸定做吗?
    answer: 部分服装与鞋款支持定制:联系客服提供净尺寸(或脚长脚宽),定制周期 7-15 个工作日,定制商品不支持无理由退货;若成品与您确认的尺寸不符,可免费重做。
    locale: zh-CN
    tags:
    - 定制
- doc_id: faq-warranty
  kind: faq
  title: 售后保修 FAQ
  source: 自造 FAQ 语料库
  published_at: '2026-09-14'
  category: 售后保修
  attribution: LLM 生成候选 + 人工筛选修订(2026-09-14 冻结);买家问/卖家客服答方向为自造
  license_note: 自造语料,不涉第三方权利:LLM 生成候选(一次)+ 人工筛选修订后冻结,冻结稿即评测基线
  entries:
  - question: 保修期多久?从什么时候开始算?
    answer: 电子产品保修 12 个月,家电类 24 个月,配件类 6 个月;保修期自签收之日起算,以订单签收记录为准(无需另行登记)。商品页标注更长期限的以页面为准。
    locale: zh-CN
    tags:
    - 保修期
  - question: 哪些情况不在保修范围内?
    answer: 以下情况不属保修:人为损坏(跌落、进水、私自拆机)、非正常使用(电压不符、超负荷)、外观磨损与自然损耗、消耗性配件(电池衰减 20% 以内属正常损耗,超出可申请保修)、非授权维修点拆动过的机器。
    locale: zh-CN
    tags:
    - 保修范围
  - question: 怎么申请保修或维修?流程是什么?
    answer: 四步:①在订单页提交「售后维修」并描述故障;②客服 1 个工作日内审核并给出寄回地址或上门取件安排;③我们检测后确认方案(维修/换新/付费维修);④修好后寄回。全程可在订单页查看进度。
    locale: zh-CN
    tags:
    - 维修流程
  - question: 维修要多久?运费谁承担?
    answer: 检测 2-3 个工作日,维修或换新 7-15 个工作日。保修期内的质量故障来回运费由我们承担(上门取件市场不额外收费);人为损坏的检测费 $50 与运费由您承担,检测后报价再决定是否维修。
    locale: zh-CN
    tags:
    - 维修流程
  - question: 保修期内坏了,可以换新吗?
    answer: 同一故障维修 2 次仍无法正常使用,或签收后 15 天内出现性能故障的,可申请换新(同型号,库存不足时换同等或更高配置);换新后保修期按新机重新计算。
    locale: zh-CN
    tags:
    - 换新
  - question: 过了保修期还能修吗?费用怎么算?
    answer: 可以维修,按「检测费 + 配件成本 + 工时」报价,检测费 $50(维修后免收);报价确认后维修,提供 90 天维修保修。是否值得维修我们会如实建议,不修的机器免费寄回。
    locale: zh-CN
    tags:
    - 过保维修
  - question: 可以购买延保服务吗?
    answer: 部分电子产品在购买时可加购延保:12 个月 $99、24 个月 $169,覆盖原厂保修到期后的同范围故障;延保需在下单时一并购买,发货后不可补购。
    locale: zh-CN
    tags:
    - 延保
  - question: 易损件和配件可以单独购买吗?
    answer: 可以。数据线、耳罩、刀头、滤网等常用配件在店铺配件专区单独售卖;停产机型的配件我们尽力保留 24 个月供应,若缺货客服会推荐兼容替代件。
    locale: zh-CN
    tags:
    - 备件
  - question: 申请保修需要提供发票或凭证吗?
    answer: 不需要额外凭证。我们用订单号即可核验购买记录与签收日期;转让或代购的商品,请让原始下单人协助提交申请,或提供订单号与购买凭证。
    locale: zh-CN
    tags:
    - 凭证
  - question: 维修或换新之后,保修期怎么算?
    answer: 维修后的机器,原保修剩余期限延续(不因维修延长);更换的部件享 90 天保修;整机换新的按新机重新计算 12 个月。三种情况以维修单上载明的为准。
    locale: zh-CN
    tags:
    - 保修期
